<html lang="fr">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Alegreya:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;600&family=Cinzel:wght@700&display=swap">
<style>
/* Layout : une seule carte au centre, une seule chose à faire à la fois. Même monde que le Grimoire, en plus calme. */
:root {
  --night: #11132a; --stone: #191c36; --stone-2: #222644; --seam: #343a62;
  --ink: #ece7da; --ink-dim: #a3a3b8; --torch: #f0a43a; --torch-deep: #b8701a;
  --rune: #6fd3b0; --blood: #e2574c; --arcane: #66c9ff;
  --f-display: "MedievalSharp", "Uncial Antiqua", Georgia, serif;
  --f-body: "Alegreya", Georgia, "Times New Roman", serif;
  --f-code: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --f-hud: "Cinzel", "Trajan Pro", Georgia, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--night); color: var(--ink); }
body { font-family: var(--f-body); font-size: 19px; line-height: 1.55; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px;
  background-image: radial-gradient(ellipse 60% 40% at 50% -10%, rgba(102,201,255,.10), transparent 70%); }
img { max-width: 100%; }
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

header { display: flex; align-items: center; gap: 12px; padding-block: 14px; border-bottom: 2px solid var(--seam); flex-wrap: wrap; }
header img { width: 44px; height: auto; }
header h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; color: var(--torch); line-height: 1; margin-right: auto; }
header h1 small { display: block; font-family: var(--f-hud); font-size: 12px; color: var(--ink-dim); letter-spacing: 1.5px; margin-top: 4px; }
.dots { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; max-width: 360px; }
.dot { width: 16px; height: 8px; background: var(--seam); }
.dot.done { background: var(--rune); }
.dot.now { background: var(--torch); }
.dot.gold { background: #e8c547; }
.ppStats { display: inline-flex; gap: 10px; align-items: center; }
.ppStat { display: inline-flex; align-items: center; gap: 4px; font-family: var(--f-code); font-size: 17px; font-weight: 700; color: var(--ink); }
.ppStat span { font-size: 20px; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.ppStat.off { opacity: .45; filter: grayscale(1); }
.ppNext { border: 1px dashed var(--seam); background: var(--stone); padding: 8px 12px; font-size: 16px; }
.ppNext b { color: var(--arcane); font-family: var(--f-hud); font-size: 12px; letter-spacing: 1px; margin-right: 6px; }
.lstars { font-size: 34px; letter-spacing: 4px; color: #e8c547; text-align: center; margin: 4px 0 0; }
.lstars + p.lsub { text-align: center; margin-top: 0; color: var(--ink-dim); }
.newcard { display: flex; gap: 12px; align-items: center; border: 2px solid #e8c547; padding: 10px; background: rgba(232,197,71,.08); }
.newcard img { width: 88px; height: 88px; object-fit: cover; border-radius: 6px; }
.agrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.acard { border: 1px solid var(--seam); background: var(--night); padding: 6px; text-align: center; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.acard img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; }
.acard.lock { opacity: .55; }
.acard .q { aspect-ratio: 1; display: grid; place-items: center; font-size: 40px; color: var(--ink-dim); border: 1px dashed var(--seam); }
.acard b { color: var(--torch); font-size: 14px; }

.lessonTag { font-family: var(--f-hud); font-size: 13px; letter-spacing: 1.6px; color: var(--arcane); }
.card { background: var(--stone); border: 1px solid var(--seam); padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.card h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(26px, 4.5vw, 34px); line-height: 1.1; text-wrap: balance; }
.card p { margin: 0; max-width: 62ch; }
.ask { font-size: 22px; line-height: 1.4; border-left: 4px solid var(--torch); padding: 6px 0 6px 14px; }
.stepcount { font-family: var(--f-hud); font-size: 12px; letter-spacing: 1.4px; color: var(--ink-dim); }
code { font-family: var(--f-code); font-size: .88em; background: var(--stone-2); padding: 1px 5px; color: var(--ink); }
.word { display: inline-grid; gap: 0; text-align: center; vertical-align: middle; margin: 2px; }
.word b { font-family: var(--f-code); font-weight: 600; font-size: 15px; background: var(--stone-2); border: 1px solid var(--seam); padding: 2px 8px; color: var(--torch); }
.word i { font-style: normal; font-size: 13px; color: var(--ink-dim); }

/* tableaux */
.tablewrap { overflow-x: auto; border: 1px solid var(--seam); }
table { border-collapse: collapse; font-family: var(--f-code); font-size: 14px; min-width: 100%; }
th { text-align: left; color: var(--torch); font-weight: 600; padding: 7px 12px; border-bottom: 1px solid var(--seam); white-space: nowrap; background: var(--stone-2); }
td { padding: 6px 12px; border-bottom: 1px solid #1c2040; white-space: nowrap; font-variant-numeric: tabular-nums; }
th .fr { display: block; font-family: var(--f-body); font-weight: 400; font-size: 12px; color: var(--ink-dim); }
tr.keep td { background: rgba(111,211,176,.14); }
tr.drop td { color: #5d6174; text-decoration: line-through; text-decoration-color: rgba(226,87,76,.6); }
td .tag { color: #11132a; font-weight: 600; padding: 1px 7px; }
.tables { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; align-items: start; }
.tables > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.partTag { color: var(--torch); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 15px; color: var(--ink-dim); }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; }
.legend .k::before { background: rgba(111,211,176,.5); }
.legend .d::before { background: rgba(226,87,76,.5); }
.count { font-family: var(--f-hud); font-size: 12px; letter-spacing: 1px; color: var(--ink-dim); }

/* blocs */
.zoneLabel { font-family: var(--f-hud); font-size: 12px; letter-spacing: 1.4px; color: var(--ink-dim); }
.phrase { min-height: 82px; border: 2px dashed var(--seam); padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
.phrase .placeholder { color: var(--ink-dim); font-style: italic; align-self: center; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; }
.tile { display: grid; gap: 2px; text-align: center; background: var(--stone-2); border: 1px solid var(--seam); border-bottom-width: 3px; padding: 8px 12px 6px; cursor: pointer; color: var(--ink); min-width: 64px; }
.tile:hover { border-color: var(--torch); }
.tile:focus-visible, .btn:focus-visible, .opt:focus-visible, textarea:focus-visible { outline: 2px solid var(--torch); outline-offset: 2px; }
.tile .sql { font-family: var(--f-code); font-weight: 600; font-size: 16px; color: var(--torch); }
.tile .fr { font-size: 13px; color: var(--ink-dim); line-height: 1.2; }
.phrase .tile { border-color: var(--torch-deep); }
.phrase .tile.given { border-style: dashed; border-color: var(--seam); opacity: .75; cursor: default; }
.phrase .tile.given:hover { border-color: var(--seam); }
.codeLine { font-family: var(--f-code); font-size: 16px; padding: 10px 12px; background: #0b0d1e; border: 1px solid var(--seam); min-height: 44px; word-break: break-word; }
.reading { font-size: 18px; color: var(--ink); }
.reading em { color: var(--arcane); font-style: normal; }

textarea { width: 100%; min-height: 96px; resize: vertical; font-family: var(--f-code); font-size: 17px; line-height: 1.5; padding: 12px; color: var(--ink); background: #0b0d1e; border: 2px solid var(--seam); }

.btns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { font-family: var(--f-hud); font-size: 14px; letter-spacing: 1px; padding: 12px 18px; border: 2px solid var(--seam); background: transparent; color: var(--ink); cursor: pointer; }
.btn:hover { border-color: var(--torch); }
.btn.main { background: var(--torch); border-color: var(--torch); color: #1a1206; box-shadow: 0 4px 0 var(--torch-deep); }
.btn.main:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--torch-deep); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }

.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; font: inherit; font-size: 18px; color: var(--ink); background: var(--stone-2); border: 1px solid var(--seam); padding: 12px 14px; cursor: pointer; }
.opt:hover { border-color: var(--torch); }
.opt.ok { border-color: var(--rune); }
.opt.no { border-color: var(--blood); }

.fb { padding: 12px 14px; border-left: 4px solid; font-size: 18px; }
.fb b { font-family: var(--f-hud); font-size: 13px; letter-spacing: 1px; font-weight: 400; display: block; margin-bottom: 2px; }
.fb.ok { border-color: var(--rune); background: rgba(111,211,176,.08); }
.fb.ok b { color: var(--rune); }
.fb.try { border-color: var(--torch); background: rgba(240,164,58,.07); }
.fb.try b { color: var(--torch); }
.fb.info { border-color: var(--arcane); background: rgba(102,201,255,.06); }
.fb.info b { color: var(--arcane); }
/* --- moyens mnémotechniques --- */
.memo { border: 2px solid var(--arcane); background: rgba(102,201,255,.06); padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.memo .notion { font-family: var(--f-hud); font-size: 12px; letter-spacing: 1.4px; color: var(--arcane); }
.memo .hook { font-size: 24px; line-height: 1.3; font-weight: 600; color: var(--ink); text-wrap: balance; }
.memo .hook u { text-decoration: none; color: var(--torch); }
.memo .detail { font-size: 17px; color: var(--ink-dim); }
.memos { display: flex; flex-direction: column; gap: 12px; }
.tip { font-size: 15px; color: var(--ink-dim); font-style: italic; }
.recall { font-family: var(--f-hud); font-size: 12px; letter-spacing: 1.4px; color: var(--night); background: var(--torch); padding: 3px 8px; align-self: flex-start; }
.wilda { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
.wilda span { display: grid; text-align: center; background: var(--stone-2); border: 1px solid var(--seam); padding: 6px 10px; }
.wilda b { font-size: 26px; font-family: var(--f-display); font-weight: 400; color: var(--torch); line-height: 1; }
.wilda i { font-style: normal; font-size: 13px; color: var(--ink-dim); }
.wilda code { font-size: 12px; }
#pocket, #train { display: flex; flex-direction: column; gap: 12px; }
#train h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 32px; }
.chain { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chain span { display: grid; grid-template-columns: auto auto; column-gap: 6px; align-items: baseline; background: var(--stone-2); border: 1px solid var(--seam); padding: 6px 9px; }
.chain b { font-family: var(--f-hud); font-size: 12px; color: var(--arcane); display: inline; margin: 0; letter-spacing: 0; }
.chain code { background: none; padding: 0; color: var(--torch); font-weight: 600; }
.chain i { grid-column: 1 / -1; font-style: normal; font-size: 14px; color: var(--ink); }
.mastery { display: flex; flex-wrap: wrap; gap: 6px; }
.mk { display: grid; gap: 3px; background: var(--stone-2); border: 1px solid var(--seam); padding: 6px 8px; }
.mk.won { border-color: var(--rune); }
.mk code { background: none; padding: 0; font-size: 13px; color: var(--ink); }
.pips { display: flex; gap: 2px; }
.pips i { width: 9px; height: 5px; background: var(--seam); }
.pips i.on { background: var(--rune); }
.tprog { display: flex; align-items: center; gap: 12px; }
.tbar { flex: 1; height: 6px; background: var(--seam); position: relative; }
.tbar i { position: absolute; inset: 0 auto 0 0; background: var(--arcane); transition: width .4s; }
.blank { display: inline-block; min-width: 70px; text-align: center; border-bottom: 2px solid var(--torch); color: var(--torch); }
.tile.placed { cursor: default; border-color: var(--rune); animation: tileIn .22s ease-out; }
.opt[disabled] { cursor: default; }
#trainBanner { border: 2px solid var(--arcane); background: rgba(102,201,255,.07); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
#trainBanner p { margin: 0; }
#pocket h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 32px; }
.learned { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
.footer { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 15px; color: var(--ink-dim); }
.footer a, .footer button { color: var(--arcane); background: none; border: 0; font: inherit; cursor: pointer; padding: 0; text-decoration: underline; }
.pop { animation: pop .35s ease-out; }
@keyframes pop { from { transform: scale(.96); opacity: .4; } to { transform: none; opacity: 1; } }
/* --- images, sons, animations --- */
.pix.ico { display: inline-flex; align-items: center; justify-content: center; flex: none; vertical-align: middle; line-height: 1; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.tile .pix { margin: 0 auto 2px; }
.zoneLabel .pix { margin-right: 6px; vertical-align: -6px; }
.hudBtns { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; align-items: center; margin-left: auto; max-width: 100%; }
.switchBtn { display: inline-flex; align-items: center; gap: 7px; font-family: var(--f-hud); font-size: 12px; letter-spacing: 1px; text-decoration: none; color: var(--night); background: var(--torch); border: 1px solid var(--torch); padding: 6px 11px; white-space: nowrap; transition: transform 0.15s ease, background 0.15s ease; }
.switchBtn:hover { background: #f7c06a; transform: translateY(-1px); }
.switchBtn:focus-visible { outline: 2px solid var(--arcane); outline-offset: 2px; }
.switchBtn .arr { font-family: var(--f-body); font-size: 15px; line-height: 1; }
@media (max-width: 560px) { .switchBtn .long { display: none; } }
.soundBtn { font-family: var(--f-hud); font-size: 12px; letter-spacing: 1px; background: none; border: 1px solid var(--seam); color: var(--ink-dim); padding: 6px 9px; cursor: pointer; }
.soundBtn:hover { border-color: var(--torch); color: var(--ink); }
.phrase .tile:not(.given) { animation: tileIn .22s ease-out; }
@keyframes tileIn { from { transform: translateY(-8px) scale(.9); opacity: .2; } to { transform: none; opacity: 1; } }
tbody tr { animation: rowIn .35s ease-out both; animation-delay: calc(var(--i, 0) * 45ms); }
@keyframes rowIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
tr.drop td { animation: bounced .5s ease-in both; animation-delay: calc(700ms + var(--i, 0) * 160ms); }
@keyframes bounced { 0% { background: transparent; color: var(--ink); text-decoration-color: transparent; } 40% { background: rgba(226,87,76,.25); color: var(--ink); text-decoration-color: transparent; } 100% { background: transparent; color: #5d6174; text-decoration-color: rgba(226,87,76,.7); } }
tr.keep td { animation: kept .5s ease-out both; animation-delay: calc(700ms + var(--i, 0) * 160ms); }
@keyframes kept { from { background: transparent; } to { background: rgba(111,211,176,.14); } }
td .tag { display: inline-block; animation: tagPulse 1.6s ease-in-out 2; animation-delay: calc(400ms + var(--i, 0) * 60ms); }
@keyframes tagPulse { 50% { transform: scale(1.18); } }
.fb, .card { position: relative; }
.spark { position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; pointer-events: none; animation: spark .85s ease-out forwards; z-index: 5; }
@keyframes spark { from { transform: translate(-50%, -50%); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(90deg); opacity: 0; } }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
.castle.hero img { aspect-ratio: 4 / 3; object-position: center 20%; }
.heroes { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.castles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 6px 0 10px; }
.castles:has(> :nth-child(4)) { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.castle { animation: rise 0.45s ease-out both; animation-delay: calc(var(--i, 0) * 0.1s); margin: 0; position: relative; border: 2px solid var(--torch-deep); border-radius: 6px; overflow: hidden; background: var(--night); }
.castle img { display: block; width: 100%; height: auto; aspect-ratio: 720 / 411; object-fit: cover; }
.castle figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 7px 5px; background: linear-gradient(transparent, rgba(17, 19, 42, 0.94) 42%); display: flex; flex-direction: column; font-size: 12px; line-height: 1.25; color: var(--ink); }
.castle figcaption b { color: var(--torch); font-size: 14px; }
.castle figcaption code { font-size: 10.5px; color: var(--ink-dim); background: none; padding: 0; }
.emo { margin-right: 6px; font-style: normal; user-select: none; -webkit-user-select: none; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.kingdom { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.kcard { border: 1px solid var(--seam); background: var(--stone-2); padding: 10px; display: flex; flex-direction: column; gap: 5px; animation: rise 0.45s ease-out both; animation-delay: calc(var(--i, 0) * 0.08s); }
.kart { margin: 0 0 4px; position: relative; border: 2px solid var(--torch-deep); border-radius: 6px; overflow: hidden; }
.kart img { display: block; width: 100%; height: auto; aspect-ratio: 720 / 411; object-fit: cover; transition: transform 0.4s ease; }
.kcard:hover .kart img { transform: scale(1.04); }
.kart figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 8px 6px; display: flex; align-items: center; gap: 6px; background: linear-gradient(transparent, rgba(17, 19, 42, 0.92) 50%); font-family: var(--f-hud); font-size: 13px; letter-spacing: 0.06em; color: var(--ink); }
.kart figcaption code { font-size: 17px; letter-spacing: 0; }
.kcols { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.kcols code { font-size: 12px !important; font-weight: 400 !important; color: var(--ink) !important; border: 1px solid var(--seam) !important; padding: 1px 5px !important; background: var(--night) !important; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .kcard, .kart img { animation: none; transition: none; } }
.kcard .pix { flex: none; }
@keyframes float { 50% { transform: translateY(-4px); } }
.kcard code { font-size: 16px; color: var(--torch); background: none; padding: 0; font-weight: 600; }
.kcard b { font-weight: 600; }
.kcard i { font-size: 14px; color: var(--ink-dim); font-style: normal; line-height: 1.3; }

/* ---------- Tablettes et écrans tactiles ---------- */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, summary, .tile, .opt, [data-ins] { touch-action: manipulation; -webkit-tap-highlight-color: rgba(240, 164, 58, 0.25); }
textarea { font-size: max(16px, 1em); }            /* sous 16 px, l'iPad zoome dès qu'on touche le champ */
@media (hover: none) {                              /* au doigt, l'effet de survol resterait « collé » après le toucher */
  .switchBtn:hover { transform: none; background: var(--torch); }
  .tile:hover, .opt:hover, .btn:hover { border-color: var(--seam); }
  .phrase .tile:hover { border-color: var(--torch-deep); }
  .opt.ok:hover { border-color: var(--rune); } .opt.no:hover { border-color: var(--blood); }
  .kcard:hover .kart img { transform: none; }
}
@media (pointer: coarse) {
  .switchBtn, .soundBtn { min-height: 42px; padding-inline: 14px; }
  .footer { gap: 6px 18px; }
  .footer a, .footer button { min-height: 44px; display: inline-flex; align-items: center; }
  .btn { min-height: 48px; }
  .tile { min-height: 52px; min-width: 48px; }
  .opt { min-height: 52px; }
}

/* ---------- Écran « Qui joue ? » ---------- */
.pgate { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(8, 9, 13, 0.88); overflow-y: auto; }
.pcard { width: 100%; max-width: 460px; background: var(--stone); border: 2px solid var(--torch); padding: 24px; display: flex; flex-direction: column; gap: 12px; text-align: center; animation: pgIn 0.35s ease-out; }
@keyframes pgIn { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: none; } }

  let ctx = null, on = true;
  try { on = localStorage.getItem("grimoire-son") !== "off"; } catch (e) {}
  const ac = () => {
    if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  };
  function tone(freq, t0, dur, type = "square", vol = 0.06, freqEnd) {
    const a = ac(); if (!a) return;
    const t = a.currentTime + t0, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  ["pointerdown", "touchend", "keydown"].forEach((ev) => document.addEventListener(ev, () => { if (on) { const a = ac(); if (a && a.state === "suspended") a.resume(); } }, { passive: true, once: false }));

const reducedMotion = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  for (let i = 0; i < n; i++) {

function frOf(t) {
  if (FR[t]) return FR[t];
  if (/^'.*'$/.test(t)) return "le texte " + t.slice(1, -1);
  if (/^\d+$/.test(t)) return "le nombre " + t;
  return "???";
}

/* ---------- Pour retenir : moyens mnémotechniques ---------- */
const MNEMOS = {
  table: { notion: "Ligne et colonne", hook: "La <u>L</u>igne, c'est <u>L</u>ui. La <u>C</u>olonne, c'est une <u>C</u>aractéristique.", detail: "Une ligne = un individu (un héros, un monstre). Une colonne = une information sur lui (son or, sa classe)." },
  anglais: { notion: "Qui parle anglais ?", hook: "Les <u>mots-clés</u> parlent anglais : SELECT, FROM, WHERE. Les <u>noms</u> parlent français : heros, nom, fortune.", detail: "Les noms des tables et des colonnes s'écrivent sans accents ni espaces : heros, chateaux, num_chateau. Les valeurs, elles, gardent leurs accents : 'Forêt Sombre'." },
  select: { notion: "SELECT", hook: "SELECT ressemble à « <u>sélectionne</u> » : je sélectionne ce que je veux voir.", detail: "Beaucoup de mots SQL ressemblent au français : SELECT = sélectionner, ORDER = ordre, GROUP = groupe, LIMIT = limite." },
  from: { notion: "FROM", hook: "<u>FROM</u> = « de » : d'où vient l'information ? <u>F</u>ROM comme <u>F</u>ichier.", detail: "Après FROM, on écrit toujours le nom d'une table." },
  star: { notion: "L'étoile *", hook: "L'étoile <u>*</u> brille sur <u>tout</u>.", detail: "* = toutes les colonnes. Pour n'en avoir que quelques-unes, on écrit leurs noms à sa place." },
  virgule: { notion: "La virgule", hook: "La virgule, c'est le « <u>et</u> » de la liste de courses.", detail: "SELECT nom, fortune = montre le nom ET l'or. Pas de virgule après la dernière colonne." },
  where: { notion: "WHERE", hook: "WHERE est le <u>videur</u> à l'entrée : seules les lignes qui respectent la condition entrent.", detail: "Where veut dire « où » : là où la condition est vraie. Le videur regarde chaque ligne, une par une." },
  croco: { notion: "> et <", hook: "Le <u>crocodile</u> ouvre la bouche vers le plus grand : 150 <u>&gt;</u> 100.", detail: "> se lit « plus grand que », < se lit « plus petit que ». pv > 100 : la bouche est tournée vers pv, c'est pv le plus grand." },
  quotes: { notion: "Les apostrophes", hook: "Un texte porte des <u>boucles d'oreilles</u> : 'Mage'.", detail: "Sans ses boucles d'oreilles (les apostrophes), la base ne le reconnaît pas comme un texte : elle croit que c'est une colonne. Les nombres, eux, n'en portent jamais." },
  accents: { notion: "Les accents", hook: "La base porte des <u>lunettes</u> : elle voit chaque accent et chaque majuscule.", detail: "'Foret' n'est pas 'Forêt', 'mage' n'est pas 'Mage'. Recopie le texte exactement comme dans la table." },
  desc: { notion: "DESC et ASC", hook: "<u>DESC</u> comme <u>DESC</u>endre : on part du plus grand et on descend. <u>ASC</u> comme <u>ASC</u>enseur : on monte.", detail: "Sans rien, c'est ASC : du plus petit au plus grand." },
  wilda: { notion: "L'ordre de la phrase", hook: "La <u>S</u>uper <u>F</u>ée <u>W</u>ilda <u>O</u>rdonne.", detail: "Quoi ? Où ? Lesquelles ? Dans quel ordre ?", extra: "<div class=\"wilda\"><span><b>S</b><i>Super</i><code>SELECT</code><i>quoi ?</i></span><span><b>F</b><i>Fée</i><code>FROM</code><i>où ?</i></span><span><b>W</b><i>Wilda</i><code>WHERE</code><i>lesquelles ?</i></span><span><b>O</b><i>Ordonne</i><code>ORDER BY</code><i>quel ordre ?</i></span></div>" },
  count: { notion: "COUNT", hook: "COUNT ressemble à « <u>compte</u> » : le comte Count compte ses sujets.", detail: "COUNT(*) = le nombre de lignes. Il remplace les colonnes après SELECT." },
  groupby: { notion: "GROUP BY", hook: "GROUP BY, c'est ranger les <u>chaussettes par couleur</u>, puis compter chaque tas.", detail: "Une ligne de résultat par tas. À côté de COUNT(*), on affiche la colonne qui fait les tas." },
  wilda2: { notion: "L'ordre de la phrase, version 2", hook: "La <u>S</u>uper <u>F</u>ée <u>W</u>ilda <u>G</u>ronde, puis <u>O</u>rdonne.", detail: "GROUP BY se glisse entre WHERE et ORDER BY : Wilda gronde avant d'ordonner.", extra: "<div class=\"wilda\"><span><b>S</b><i>Super</i><code>SELECT</code></span><span><b>F</b><i>Fée</i><code>FROM</code></span><span><b>W</b><i>Wilda</i><code>WHERE</code></span><span><b>G</b><i>Gronde</i><code>GROUP BY</code></span><span><b>O</b><i>Ordonne</i><code>ORDER BY</code></span></div>" },
  id: { notion: "id", hook: "<u>id</u> comme <u>id</u>entité : le numéro de carte d'identité de la ligne.", detail: "Dans chaque table, id est le numéro de la ligne. Et num_chateau, chez un héros, c'est le numéro de son château : num_ annonce un numéro qui renvoie vers une autre table. Comme un castel : un château." },
  point: { notion: "Le point", hook: "Le point se lit « <u>de</u> » : heros.nom = le nom <u>de</u> heros.", detail: "D'abord la maison (la table), puis la pièce (la colonne), comme une adresse." },
  join: { notion: "JOIN et ON", hook: "JOIN ressemble à « <u>joindre</u> ». ON, c'est la <u>poignée de main</u> : chaque héros serre la main du château qui porte le même numéro.", detail: "ON heros.num_chateau = chateaux.id : le numéro chez le héros = le numéro du château." },
  joinwhere: { notion: "JOIN puis WHERE", hook: "On se donne d'abord la <u>main</u>, ensuite on passe devant le <u>videur</u>.", detail: "JOIN … ON vient avant WHERE dans la phrase." },
  sum: { notion: "SUM", hook: "SUM ressemble à « <u>somme</u> » : on additionne.", detail: "COUNT compte combien il y a de pièces ; SUM additionne leur valeur. Compter ≠ additionner." },
  leftjoin: { notion: "LEFT JOIN", hook: "LEFT JOIN, c'est la <u>photo de classe</u> : tout le monde est sur la photo, même ceux qui n'ont pas de partenaire.", detail: "JOIN ne garde que les couples. LEFT JOIN garde toute la table de gauche ; les cases sans partenaire restent vides (NULL)." },
  isnull: { notion: "NULL et IS NULL", hook: "NULL, c'est une <u>case vide</u>. On demande « est-ce vide ? » : <u>IS</u> NULL.", detail: "On ne peut pas être égal à du vide : = NULL ne trouve jamais rien. Toujours IS NULL." },
  having: { notion: "HAVING", hook: "WHERE est le videur de l'<u>entrée</u> (les lignes). HAVING est le videur de la <u>sortie</u> (les tas).", detail: "HAVING passe après GROUP BY : il peut utiliser COUNT, SUM ou AVG." },
  wilda3: { notion: "L'ordre de la phrase, version 3", hook: "La <u>S</u>uper <u>F</u>ée <u>W</u>ilda <u>G</u>ronde, <u>H</u>urle, puis <u>O</u>rdonne.", detail: "HAVING (Hurle) vient juste après GROUP BY (Gronde), avant ORDER BY (Ordonne).", extra: "<div class=\"wilda\"><span><b>S</b><i>Super</i><code>SELECT</code></span><span><b>F</b><i>Fée</i><code>FROM</code></span><span><b>W</b><i>Wilda</i><code>WHERE</code></span><span><b>G</b><i>Gronde</i><code>GROUP BY</code></span><span><b>H</b><i>Hurle</i><code>HAVING</code></span><span><b>O</b><i>Ordonne</i><code>ORDER BY</code></span></div>" },
  avg: { notion: "AVG", hook: "AVG comme « <u>av</u>era<u>g</u>e » : la <u>moyenne</u>, comme la moyenne de ta classe.", detail: "AVG additionne toutes les valeurs, puis divise par le nombre de lignes." },
  subquery: { notion: "La sous-requête", hook: "Les parenthèses, c'est la <u>boîte de l'assistant</u> : il fait son calcul en premier et te donne le résultat.", detail: "( SELECT AVG(pv) FROM monstres ) devient un simple nombre, que la grande phrase utilise." },
  in: { notion: "IN", hook: "IN veut dire « <u>dans</u> » : est-ce que ce numéro est <u>dans</u> la liste ?", detail: "num_heros IN (3, 6) = le numéro vaut 3 ou 6. La liste peut venir de la boîte de l'assistant." },
  insert: { notion: "INSERT", hook: "INSERT ressemble à « <u>insérer</u> ». On remplit un <u>formulaire</u> : les cases, puis les valeurs, dans le même ordre.", detail: "INSERT INTO table (colonnes) VALUES (valeurs). Les textes gardent leurs boucles d'oreilles." },
  update: { notion: "UPDATE", hook: "UPDATE = mettre <u>à jour</u>. Toujours avec son <u>videur</u> WHERE, sinon tout le royaume est modifié.", detail: "SET colonne = nouvelle valeur. fortune = fortune + 100 : l'or actuel, plus 100." },
  delete: { notion: "DELETE", hook: "DELETE ressemble à « <u>délète</u> » : effacer. <u>Regarde</u> (SELECT) avant de <u>détruire</u> (DELETE).", detail: "Pas de corbeille. Le même WHERE dans le SELECT de vérification et dans le DELETE." },
  distinct: { notion: "DISTINCT", hook: "DISTINCT ressemble à « <u>distinct</u> » : une <u>liste d'invités</u> où chaque nom n'apparaît qu'une fois.", detail: "Il retire les doublons du résultat, pas de la table. Il compare les lignes entières affichées." },
  like: { notion: "LIKE et %", hook: "LIKE ressemble à « <u>ressemble</u> ». Le <u>%</u> est un <u>joker</u> : il remplace n'importe quelles lettres.", detail: "'L%' : commence par L. '%L' : finit par L. '%L%' : contient un L. Sans %, LIKE cherche le texte exact." },
  notlike: { notion: "NOT", hook: "NOT, c'est le « <u>sauf</u> » : NOT LIKE 'Tour%' = tout, sauf ce qui commence par Tour.", detail: "NOT inverse la condition qui le suit." },
  case: { notion: "CASE", hook: "CASE se lit comme une phrase : <u>WHEN</u> (quand) … <u>THEN</u> (alors) … <u>ELSE</u> (sinon) … <u>END</u> (fin).", detail: "CASE fabrique une étiquette pour chaque ligne. Il commence par CASE et finit toujours par END." },
  limit: { notion: "LIMIT", hook: "LIMIT ressemble à « <u>limite</u> » : les ciseaux qui coupent la liste, en <u>tout dernier</u>.", detail: "On trie d'abord (ORDER BY), on coupe ensuite (LIMIT 3). Dans la chaîne des questions, c'est « combien ? »." },
  or: { notion: "AND et OR", hook: "AND est un <u>parent sévère</u> : il veut tout. OR est un <u>grand-parent gâteau</u> : une seule chose lui suffit.", detail: "Chaque côté du OR est une condition complète : region = 'Forêt Sombre' OR region = 'Marais Putride'." },
  parens: { notion: "Les parenthèses", hook: "AND passe avant OR, comme <u>× avant +</u>. Les parenthèses sont une <u>boîte</u> : le OR reste enfermé dedans.", detail: "(A OR B) AND C : d'abord « A ou B », ensuite « et C ». Sans boîte, la base lit A OR (B AND C)." },
  minmax: { notion: "MIN et MAX", hook: "MIN comme <u>min</u>imum, MAX comme <u>max</u>imum : le plus <u>petit</u> et le plus <u>grand</u>.", detail: "Un seul nombre pour toute la colonne. Pour savoir à qui il appartient : WHERE colonne = (SELECT MAX(colonne) FROM table)." },
  between: { notion: "BETWEEN", hook: "BETWEEN = « <u>entre</u> » : une <u>fenêtre</u> avec ses deux montants. Les montants font partie de la fenêtre.", detail: "niveau BETWEEN 5 AND 10 garde 5, 6, 7, 8, 9 et 10. Le AND fait partie du BETWEEN." },
  create: { notion: "CREATE TABLE", hook: "CREATE = « <u>créer</u> ». L'architecte dessine d'abord le <u>plan</u>, la maison est vide au début.", detail: "CREATE TABLE nom (colonne TYPE, colonne TYPE, …). Une table neuve n'a aucune ligne." },

      if (!d.list.includes(found)) d.list.push(found);
      if (data.id) d.ids[low(found)] = String(data.id).slice(0, 60);
      Object.entries(data.k || {}).forEach(([base, val]) => { if (/^grimoire-[\w-]+$/.test(base) && typeof val === "string") try { localStorage.setItem(slot(base, found), val); } catch (e) {} });
      d.current = found; persist(); return found;
    }
  };
})();

/* ---------- CODE DE SAUVEGARDE : la partie tient dans un texte à copier sur un autre appareil ---------- */
const b64u = {
  enc: (bytes) => { let s = ""; bytes.forEach((b) => { s += String.fromCharCode(b); }); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); },
  dec: (str) => { const s = atob(str.replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(s, (c) => c.charCodeAt(0)); }
};
async function streamBytes(bytes, Stream, mode) { const r = new Blob([bytes]).stream().pipeThrough(new Stream(mode)); return new Uint8Array(await new Response(r).arrayBuffer()); }
async function packSave(name) {
  const raw = new TextEncoder().encode(JSON.stringify(Players.snapshot(name)));
  if (window.CompressionStream) { try { return "GRIM1." + b64u.enc(await streamBytes(raw, CompressionStream, "deflate-raw")); } catch (e) {} }
  return "GRIM0." + b64u.enc(raw);
}
async function unpackSave(code) {
  const m = String(code || "").replace(/\s+/g, "").match(/^GRIM([01])\.([\w-]+)$/);
  if (!m) throw new Error("Ce n'est pas un code de sauvegarde du Grimoire : il doit commencer par GRIM.");
  let bytes = b64u.dec(m[2]);
  if (m[1] === "1") { if (!window.DecompressionStream) throw new Error("Ce navigateur est trop ancien pour lire ce code. Mets-le à jour, ou essaie un autre navigateur."); bytes = await streamBytes(bytes, DecompressionStream, "deflate-raw"); }
  const data = JSON.parse(new TextDecoder().decode(bytes));
  if (!data || data.v !== 1 || !data.n || typeof data.k !== "object") throw new Error("Ce code est incomplet ou abîmé. Recopie-le en entier.");
  return data;
}

function shuffleStable(arr, seed) {
  const a = arr.map((v, i) => ({ v, k: Math.sin(seed * 97 + i * 13.7) })); a.sort((p, q) => p.k - q.k); return a.map((x) => x.v);
}

}

function renderBuild(S, head) {
  const given = S.given || [];
  const bankAll = shuffleStable([...S.target.slice(given.length), ...(S.extra || [])], st.l * 10 + st.s);
  const full = () => [...given, ...placed];
  show(`${head}<p class="ask">${esc(S.ask)}</p>
    <span class="zoneLabel">${given.length ? "TA PHRASE · le début est déjà posé (en pointillés), à toi de la finir" : "TA PHRASE (clique sur un bloc posé pour le retirer)"}</span>
    <div class="phrase" id="phrase"></div>
    <div class="codeLine" id="codeLine" aria-label="Ta requête"></div>
    <p class="reading" id="reading"></p>
    <span class="zoneLabel">LES BLOCS (clique dans l'ordre de la phrase)</span>
    <div class="bank" id="bank"></div>
    <div class="btns"><button class="btn main" id="check">Vérifier</button><button class="btn" id="clear">Tout effacer</button></div>
    <div id="fb"></div>
    <span class="zoneLabel">RÉSULTAT EN DIRECT</span>
    <div id="live"></div>`);
  const tile = (t, i, where) => `<button class="tile" data-${where}="${i}">${PIX[t] ? pixIcon(t, 22) : ""}<span class="sql">${esc(t)}</span><span class="fr">${esc(frOf(t))}</span></button>`;
  const draw = () => {
    const used = placed.slice();
    const bank = []; const counts = {};
    used.forEach((t) => counts[t] = (counts[t] || 0) + 1);
    bankAll.forEach((t, i) => { if (counts[t]) counts[t]--; else bank.push([t, i]); });
    $("phrase").innerHTML = given.map((t) => `<span class="tile given">${PIX[t] ? pixIcon(t, 22) : ""}<span class="sql">${esc(t)}</span><span class="fr">${esc(frOf(t))}</span></span>`).join("") +
      (placed.length ? placed.map((t, i) => tile(t, i, "p")).join("") : `<span class="placeholder">${given.length ? "← continue ici" : "Ta phrase apparaîtra ici."}</span>`);
    $("bank").innerHTML = bank.map(([t, i]) => tile(t, i, "b")).join("") || `<span class="placeholder">Tous les blocs sont posés.</span>`;
    const q = full().join(" ").replace(/ ,/g, ",");
    $("codeLine").textContent = q || "…";
    $("reading").innerHTML = full().length ? ("Ta phrase se lit : « " + full().map((t, i, arr) => `<em>${esc(t === "=" && arr.slice(0, i).includes("SET") && !arr.slice(0, i).includes("WHERE") ? "devient" : frOf(t))}</em>`).join(" ") + " »").replace(/est égal à <em>le /g, "est égal au <em>").replace(/<em>est égal à<\/em> <em>le /g, "<em>est égal au</em> <em>") : "";
    const r = q ? evalQ(S, q) : {};
    const noOn = !S.write && r.res && /\bJOIN\b/i.test(q) && !/\bON\b/i.test(q);
    const eqJoker = /(^|[^<>!])=\s*'[^']*%[^']*'/.test(q);   // = avec un joker % : la base cherche le texte exact « L% »
    $("live").innerHTML = r.res ? (eqJoker ? `<div class="fb info"><b>POURQUOI AUCUNE LIGNE ?</b>Avec =, la base cherche un nom qui s'écrit <b>exactement</b> « ${esc((q.match(/'([^']*%[^']*)'/) || [])[1] || "")} », avec le signe % dedans. Aucun monstre ne s'appelle comme ça ! Le joker % ne marche qu'avec <b>LIKE</b> (« ressemble à »). Clique sur le bloc = dans ta phrase pour le retirer, puis prends LIKE.</div>` : "") + (noOn ? `<div class="fb info"><b>REGARDE CE QUI SE PASSE SANS ON</b>Sans règle, la base colle chaque ligne de la première table à chaque ligne de la seconde : ${r.res.values.length} lignes, dont la plupart n'ont aucun sens. ON donne la règle pour ne garder que les bonnes paires.</div>` : "") + r.html : `<p class="count">${placed.length ? "La phrase n'est pas encore complète : pas de résultat pour l'instant." : "Pose des blocs pour voir le résultat se construire."}</p>`;
    document.querySelectorAll("[data-b]").forEach((b) => b.onclick = () => { placed.push(bankAll[+b.dataset.b]); FX.play("click"); $("fb").innerHTML = ""; draw(); });
    document.querySelectorAll("[data-p]").forEach((b) => b.onclick = () => { placed.splice(+b.dataset.p, 1); FX.play("unclick"); $("fb").innerHTML = ""; draw(); });
  };
  draw();
  $("clear").onclick = () => { placed = []; $("fb").innerHTML = ""; draw(); };
  $("check").onclick = () => {
    const trap = placed.find((t) => S.traps && S.traps[t]);
    const q = full().join(" ").replace(/ ,/g, ",");
    const tv = evalQ(S, S.target.join(" ").replace(/ ,/g, ",")), target = tv.res;
    const r = q ? evalQ(S, q) : {};
    let fb;
    if (!placed.length) fb = `<div class="fb try"><b>RIEN ENCORE</b>Clique sur les blocs, dans l'ordre, pour construire ta phrase.</div>`;
    else if (trap) fb = `<div class="fb try"><b>REGARDE CE BLOC</b>${esc(S.traps[trap])}</div>`;
    else if (full().join("|") === S.target.join("|") || (r.res && sameResult(r.res, target, S.ordered))) {
      fb = `<div class="fb ok"><b>BRAVO</b>${esc(S.why)}</div>${caseNote(S, r, tv)}${nextBtn()}`;
    } else if (r.res && S.ddl) {
      fb = `<div class="fb try"><b>LA PHRASE MARCHE, MAIS…</b>${esc(ddlMsg(r, tv))}</div>`;
    } else if (r.res && S.write) {
      fb = `<div class="fb try"><b>LA PHRASE MARCHE, MAIS…</b>${esc(writeMsg(r, tv, q))}</div>`;
    } else if (r.res) {
      fb = `<div class="fb try"><b>LA PHRASE MARCHE, MAIS…</b>Elle donne ${r.res.values.length} ligne(s) et ${r.res.columns.length} colonne(s) ; la question en demande ${target.values.length} et ${target.columns.length}. Relis la question : quelles colonnes ? quelle table ? quelle condition ?</div>`;
    } else {
      const missing = S.target.length - full().length;
      fb = `<div class="fb try"><b>PAS ENCORE</b>${missing > 0 ? `Il te manque ${missing} bloc(s). ` : ""}Rappel de l'ordre d'une phrase : <b>SELECT</b> (quoi montrer ?) → <b>FROM</b> (quelle table ?) → <b>WHERE</b> (quelle condition ?) → <b>ORDER BY</b> (quel ordre ?).</div>`;
    }
    $("fb").innerHTML = fb;
    if (/fb ok/.test(fb)) { FX.play("good"); burst($("fb").firstElementChild); } else { FX.play("bad"); shake($("phrase")); if (placed.length) oops(); }
    if ($("next")) { $("next").onclick = advance; $("next").focus(); }
  };
}

function buildSession(n = 10) {
  const pool = trainPool(), q = [];
  let last = null;
  for (let i = 0; i < n; i++) {
    const cand = pool.filter((id) => id !== last);
    const weights = cand.map((id) => 6 - boxOf(id));      // jamais vu = 6, maîtrisé = 1
    let r = Math.random() * weights.reduce((a, b) => a + b, 0), pick = cand[0];
    for (let j = 0; j < cand.length; j++) { r -= weights[j]; if (r <= 0) { pick = cand[j]; break; } }
    q.push(makeItem(pick)); last = pick;
  }
  return { q, i: 0, ok: 0, requeued: new Set(), missed: new Set() };
}
function makeItem(id, avoidType) {
  const o = ORDERS.find((x) => x.id === id);
  if (o) return { id, type: "order", seq: o.seq };
  const types = ["toSql", "toFr"];
  if (SAMPLES.some((s) => s.includes(id))) types.push("complete", "complete");
  const t = shuffle(types.filter((x) => x !== avoidType))[0] || "toSql";
  if (t === "complete") { const s = shuffle(SAMPLES.filter((x) => x.includes(id)))[0]; return { id, type: t, sample: s }; }
  return { id, type: t };
}

  const others = (pool.length >= 3 ? pool : CARDS.filter((c) => c.k !== id));
  return shuffle(others).slice(0, 3).map((c) => c[field]);
}

const dayNum = (k) => { const [y, m, d] = k.split("-").map(Number); return Math.round(Date.UTC(y, m - 1, d) / 86400000); };
const weekKey = (d = new Date()) => {

  t.setUTCDate(t.getUTCDate() + 4 - wd); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));

const Shared = {

const keyDate = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
function foldStreak(s0, days) {      // rejoue les jours actifs après la dernière date connue (le joker sauve un jour manqué par semaine)
  const s = Object.assign({ n: 0, last: null, best: 0, jokerWeek: null }, s0 || {});
  days.filter((d) => !s.last || d > s.last).sort().forEach((d) => {
    const gap = s.last ? dayNum(d) - dayNum(s.last) : 99, wk = weekKey(keyDate(d));
    if (gap === 1) s.n += 1; else if (gap === 2 && s.jokerWeek !== wk) { s.n += 1; s.jokerWeek = wk; } else s.n = 1;
    s.last = d; s.best = Math.max(s.best || 0, s.n);
  });
  return s;
}

const ALL_CARDS = [1, 2, 3, 4, 5, 6].map((i) => "h" + i).concat([1, 2, 3, 4, 5, 6, 7, 8, 9].map((i) => "m" + i), [1, 2, 3].map((i) => "c" + i));
function cardInfoPP(k) {
  const kind = { h: "heros", m: "monstres", c: "chateaux" }[k[0]], id = +k.slice(1);
  const name = (run(`SELECT nom FROM ${kind} WHERE id = ${id}`).values[0] || ["?"])[0];
  return { k, kind, id, name, img: ({ h: HERO_ART, m: MONSTER_ART, c: CASTLE_ART }[k[0]])[id] || "" };
}

  if (n && !Shared.get(Shared.DAYS).includes(dayKey())) {
    const g = Players.read("grimoire-sql-v1", Players.current) || {};
    if (!(g.streak && g.streak.last === dayKey())) return `🔥 Termine une leçon aujourd'hui pour garder ta série de ${n} jour${n > 1 ? "s" : ""}.`;
  }
  const own = new Set(Shared.get(Shared.ALB)), nextL = Object.keys(PP_CARDS).map(Number).filter((l) => l >= st.l && !own.has(PP_CARDS[l]))[0];
  if (nextL !== undefined && nextL < LESSONS.length) return `📒 Termine la leçon ${nextL + 1} pour gagner la carte « ${esc(cardInfoPP(PP_CARDS[nextL]).name)} ».`;
  const low = st.done.filter((l) => ((st.stars || {})[l] || 0) < 3);
  if (low.length) return `⭐ ${low.length} leçon${low.length > 1 ? "s" : ""} à refaire sans erreur pour les 3 étoiles (la leçon ${low[0] + 1}, par exemple).`;
  return "";
}
function openPPAlbum() {
  const old = document.getElementById("playerGate"); if (old) old.remove();
  const own = new Set(Shared.get(Shared.ALB)), byCard = {}; Object.entries(PP_CARDS).forEach(([l, k]) => byCard[k] = +l);
  const cell = (k) => { const c = cardInfoPP(k);
    return own.has(k) ? `<div class="acard">${c.img ? `<img src="${c.img}" alt="">` : ""}<b>${esc(c.name)}</b></div>`
      : `<div class="acard lock"><span class="q" aria-hidden="true">?</span><span>Leçon ${byCard[k] + 1}</span></div>`; };
  const g = document.createElement("div"); g.id = "playerGate"; g.className = "pgate";
  g.innerHTML = `<div class="pcard" style="max-width:760px" role="dialog" aria-modal="true" aria-labelledby="alT">
    <h2 id="alT">📒 Mon album · ${ALL_CARDS.filter((k) => own.has(k)).length}/${ALL_CARDS.length}</h2>
    <p>Les leçons et les missions de l'aventure débloquent les mêmes cartes. ${location.protocol === "file:" || /claude/.test(location.hostname) ? "" : "Elles se retrouvent dans l'album de l'aventure."}</p>
    <div class="agrid">${ALL_CARDS.map(cell).join("")}</div>
    <button class="pclose" id="alClose">Fermer</button></div>`;
  document.body.appendChild(g); $("alClose").onclick = () => g.remove(); $("alClose").focus();
}
function ppSummary(name) {
  const x = Players.read(SAVE, name);
  if (!x || typeof x.l !== "number") return "nouvelle partie";
  return x.l >= LESSONS.length ? "Premiers pas terminés" : `leçon ${x.l + 1} sur ${LESSONS.length} · ${(x.done || []).length} réussies`;
}
function showPlayer() { $("playerName").textContent = Players.current || "Joueur"; }
function openPlayers(first) {
  playerGate({ summary: ppSummary, bases: [SAVE, TSAVE, Shared.DAYS, Shared.ALB], legacy: [SAVE, TSAVE], canClose: !first,
    onChoose: () => { loadSt(); loadTR(); placed = []; showPlayer(); $("train").hidden = true; $("pocket").hidden = true; $("card").hidden = false; render(); FX.play("win"); window.scrollTo({ top: 0 }); } });
}
$("playerBtn").onclick = () => { FX.play("page"); openPlayers(false); };
showPlayer();
(async function boot() {
  try {
    SQL = await initSqlJs({ wasmBinary: Uint8Array.from(atob(WASM_B64), (c) => c.charCodeAt(0)) });
    render();
    if (!Players.current) openPlayers(true);       // premier accès : on demande le nom du joueur
  } catch (e) { $("card").innerHTML = `<p>Le moteur n'a pas pu démarrer dans ce navigateur : ${esc(e.message)}</p>`; }
})();
</script>
